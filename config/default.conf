# Default configuration for `localhost`.
#
# Run with:
#   cargo run --release -- config/default.conf
#
# Two virtual hosts on 127.0.0.1:8080 (default + `second.localhost`,
# picked apart by the Host header — see `curl --resolve` below), plus a
# second port on the default host to show one process/one listener set
# serving multiple ports at once.

server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8081;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 5m;

    error_page 400 /error_pages/400.html;
    error_page 403 /error_pages/403.html;
    error_page 404 /error_pages/404.html;
    error_page 405 /error_pages/405.html;
    error_page 413 /error_pages/413.html;
    error_page 500 /error_pages/500.html;

    route / {
        methods GET;
        index index.html;
        autoindex off;
    }

    route /files {
        methods GET;
        root ./www/files;
        autoindex on;
    }

    route /old-page {
        methods GET;
        return 301 /index.html;
    }

    route /uploads {
        methods GET POST DELETE;
        root ./www/uploads;
        upload_store ./www/uploads;
        autoindex on;
    }

    route /cgi-bin {
        methods GET POST;
        root ./www/cgi-bin;
        cgi .py python3;
    }
}

# curl --resolve second.localhost:8080:127.0.0.1 http://second.localhost:8080/
server {
    listen 127.0.0.1:8080;
    server_name second.localhost;
    root ./www-second;
    index index.html;

    route / {
        methods GET;
        index index.html;
    }
}
