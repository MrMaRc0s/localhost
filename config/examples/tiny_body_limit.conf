# A tiny client_max_body_size to make 413 easy to trigger on demand:
#
#   curl -X POST --data "short" http://127.0.0.1:8080/uploads/a.txt   -> 201
#   curl -X POST --data "this body is longer than 16 bytes, so it 413s" \
#        http://127.0.0.1:8080/uploads/a.txt                          -> 413

server {
    listen 127.0.0.1:8080;
    root ./www;
    index index.html;
    client_max_body_size 16;

    route / { methods GET; index index.html; }

    route /uploads {
        methods GET POST DELETE;
        root ./www/uploads;
        upload_store ./www/uploads;
        autoindex on;
    }
}
