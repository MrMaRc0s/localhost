# Multiple independent servers, each on its own port.
# cargo run --release -- config/examples/multi_port.conf

server {
    listen 127.0.0.1:8080;
    root ./www;
    index index.html;
    route / { methods GET; index index.html; }
}

server {
    listen 127.0.0.1:8082;
    root ./www-second;
    index index.html;
    route / { methods GET; index index.html; }
}
