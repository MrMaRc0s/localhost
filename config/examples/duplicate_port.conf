# Deliberately invalid: two server blocks on the same listen address,
# neither disambiguated by server_name — the config validator must
# reject this at startup with a clear error instead of silently binding
# (or crashing). See src/config/validate.rs.
#
#   $ cargo run --release -- config/examples/duplicate_port.conf
#   localhost: configuration error: 127.0.0.1:8080: 2 server blocks
#   declare no server_name — cannot tell which one is the default

server {
    listen 127.0.0.1:8080;
    root ./www;
    route / { methods GET; }
}

server {
    listen 127.0.0.1:8080;
    root ./www-second;
    route / { methods GET; }
}
